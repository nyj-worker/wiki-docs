<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="description" content="바이브코딩과 AI 도구를 공부할 때 참고할 위키독스 자료 모음">
  <title>위키트리 | 위키독스 학습 자료</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="catalog.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-tree" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="15" y="9.5" width="6" height="5" rx="1"/><rect x="15" y="17" width="6" height="5" rx="1"/><path d="M5.5 8v8.5a3 3 0 0 0 3 3H15M5.5 12H15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.75" cy="10.75" r="6.25"/><path d="m15.4 15.4 4.35 4.35"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM9 4h4v16H9zM14.5 5l3.8-1 4.1 15-3.8 1z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 17V7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1M4 19h14a2 2 0 0 0 1.8-1.2l2-4.7a1.5 1.5 0 0 0-1.4-2.1H7.2a2 2 0 0 0-1.8 1.2L3.1 17a1.4 1.4 0 0 0 .9 2Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 19V5a2 2 0 0 1 2-2h12v18H7a2 2 0 0 1 0-4h12M9 7h6M9 10h4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m8 5 4 4 4-4m-8 14 4-4 4 4"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4m-8 6 4 4 4-4"/></symbol>
    <symbol id="i-qa" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.5-3.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M10.5 9.4a1.7 1.7 0 1 1 2.5 1.5c-.6.4-1 .8-1 1.6M12 15h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15m-6-6 6 6 6-6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-preview" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 9h6V3m6 0v6h6M9 21v-6H3m12 6v-6h6"/></symbol>
  </svg>

  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="brand-group">
      <button id="menu-button" class="icon-button mobile-menu" type="button" aria-label="목차 열기" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <a class="brand" href="#all">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-tree"/></svg></span>
        <span>위키트리</span>
      </a>
    </div>
    <form id="search-form" class="search" role="search">
      <label class="sr-only" for="search-input">자료, 학습 안내, Q&amp;A 검색</label>
      <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search-input" type="search" autocomplete="off" maxlength="120" placeholder="자료, 학습 안내, Q&amp;A 검색" aria-controls="content">
      <kbd class="shortcut" aria-hidden="true">Ctrl K</kbd>
      <button id="clear-search" class="icon-button search-clear" type="button" aria-label="검색어 지우기" hidden><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </form>
    <a class="qa-link" id="qa-link" href="#qa"><svg class="icon" aria-hidden="true"><use href="#i-qa"/></svg><span>학습 Q&amp;A</span></a>
  </header>

  <div class="layout">
    <div id="scrim" class="scrim" aria-hidden="true" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="학습 자료 목차">
      <div class="sidebar-heading">
        <h2>목차</h2>
        <button id="toggle-all" class="icon-button" type="button" aria-label="모든 분야 접기" title="모든 분야 접기"><svg class="icon" aria-hidden="true"><use href="#i-collapse"/></svg></button>
      </div>
      <nav id="tree" aria-label="분야와 자료"></nav>
    </aside>
    <main id="content" class="content" tabindex="-1"></main>
    <p id="search-status" class="sr-only" role="status" aria-atomic="true"></p>
  </div>
  <dialog id="book-reader" class="reader" aria-labelledby="reader-title">
    <header class="reader-toolbar">
      <div class="reader-heading">
        <span class="tile-icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></span>
        <h2 id="reader-title"></h2>
      </div>
      <button id="reader-size" class="reader-button" type="button" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-maximize"/></svg><span>전체화면</span>
      </button>
      <a id="reader-source" class="reader-button reader-source" target="_blank" rel="noopener" aria-describedby="opens-new-tab">
        <span>바로 이동</span><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
      </a>
      <button id="reader-close" class="icon-button" type="button" aria-label="모달 닫기" autofocus>
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <iframe id="reader-frame" title="위키독스 원문" referrerpolicy="no-referrer"></iframe>
    <p class="reader-note">원문이 표시되지 않으면 <strong>바로 이동</strong>을 눌러 새 탭에서 읽을 수 있습니다.</p>
  </dialog>
  <noscript>분야별 목차와 검색을 사용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
